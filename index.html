<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Рига — полёт над городом</title>
<style>
html,body{margin:0;height:100%;background:#141420;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff3e2;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(30,18,20,.25),rgba(12,8,14,.8));transition:opacity .8s}
#ov.h{opacity:0;pointer-events:none}
h1{font-weight:200;letter-spacing:.42em;margin:0 0 10px .42em;font-size:clamp(34px,9vw,76px);text-shadow:0 0 30px rgba(255,190,120,.5)}
#ov p{margin:4px 0;max-width:540px;font-size:14px;line-height:1.5;opacity:.82}
#go{margin:26px 0 18px;padding:14px 44px;font:inherit;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:#fff8ee;background:rgba(255,190,120,.14);border:1px solid rgba(255,210,160,.6);border-radius:40px;cursor:pointer}
#go:hover{background:rgba(255,190,120,.28)}
#hud{position:fixed;left:14px;top:12px;font-size:13px;letter-spacing:.06em;opacity:.85;text-shadow:0 1px 4px #000;font-variant-numeric:tabular-nums;pointer-events:none}
#nm{position:fixed;left:0;right:0;bottom:26px;text-align:center;font-size:clamp(15px,2.4vw,22px);font-weight:300;letter-spacing:.14em;text-shadow:0 1px 8px #000,0 0 2px #000;pointer-events:none;opacity:0;transition:opacity .7s}
#bt{position:fixed;right:10px;top:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#bt button{font:inherit;font-size:12px;color:#fff3e2;background:rgba(30,20,20,.45);border:1px solid rgba(255,210,160,.35);border-radius:16px;padding:7px 12px;cursor:pointer}
#bt button.on{background:rgba(255,190,120,.3)}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(255,230,200,.4);border-radius:50%;display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,230,200,.3)}
#er{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;white-space:pre-wrap;background:#141420;font-size:13px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="nm"></div>
<div id="bt"><button id="bTour" class="on">Тур</button><button id="bTod">Закат</button><button id="bSnd">Звук</button><button id="bQ">Качество</button></div>
<div id="joy"><i></i></div>
<div id="ov">
  <h1>РИГА</h1>
  <p>Процедурный полёт над Ригой в одном HTML-файле. WebGL2, без движка, библиотек, моделей и файлов текстур: город строится кодом при загрузке.</p>
  <button id="go">Взлететь</button>
  <p>Компьютер: WASD — лететь, мышь — смотреть, E / Q — вверх / вниз, Shift — быстрее.</p>
  <p>Телефон: левая половина экрана — лететь, правая — смотреть.</p>
</div>
<div id="er"></div>
<script>
'use strict';
/* ============ helpers ============ */
const $=id=>document.getElementById(id),cv=$('c'),QS=new URLSearchParams(location.search);
function fail(t){const e=$('er');e.textContent=t;e.style.display='flex';$('ov').style.display='none'}
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){fail('Этому браузеру не хватает WebGL2, поэтому город не может запуститься.');throw new Error('no webgl2')}
let seed=2024;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+rnd()*(b-a),pick=a=>a[Math.floor(rnd()*a.length)];
const fr=x=>x-Math.floor(x),h2=(x,y)=>fr(Math.sin(x*127.1+y*311.7)*43758.5453);
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const mul=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o};
const persp=(fy,as,n,f)=>{const t=1/Math.tan(fy/2);return new Float32Array([t/as,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0])};
const catmull=(a,b,c,d,t)=>.5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t*t+(3*b-a-3*c+d)*t*t*t);

/* ============ world layout (metres; x = east, z = south, origin = St. Peter's) ============ */
const COARSE=matchMedia('(pointer:coarse)').matches||QS.has('lo');
const MAPN=COARSE?1024:2048,MAPS=6144,MCX=0,MCZ=600,K=MAPN/MAPS,STEP=1/K,WL=-4;
/* Daugava centreline: x, z, half-width */
const RP=[[-2900,-4800,340],[-2300,-3400,330],[-1750,-2100,320],[-1250,-1150,300],[-893,-473,275],[-498,217,275],[-255,640,290],[250,1250,380],[953,1800,520],[1694,2616,600],[2400,3500,520],[3000,4400,450],[3600,5300,450]];
const RC=[];
for(let i=1;i<RP.length-2;i++)for(let k=0;k<14;k++)RC.push([0,1,2].map(j=>catmull(RP[i-1][j],RP[i][j],RP[i+1][j],RP[i+2][j],k/14)));
RC.forEach((c,i)=>{const a=RC[Math.max(i-1,0)],b=RC[Math.min(i+1,RC.length-1)],l=Math.hypot(b[0]-a[0],b[1]-a[1]);c[3]=(b[0]-a[0])/l;c[4]=(b[1]-a[1])/l});
function riv(x,z){let b=0,bd=1e12;for(let i=0;i<RC.length;i++){const dx=x-RC[i][0],dz=z-RC[i][1],d=dx*dx+dz*dz;if(d<bd){bd=d;b=i}}
  const c=RC[b];return{i:b,d:Math.sqrt(bd),hw:c[2],s:c[3]*(z-c[1])-c[4]*(x-c[0])}}
const rcNear=(x,z)=>RC[riv(x,z).i];
const inEl=(e,x,z)=>{const c=Math.cos(e[4]||0),s=Math.sin(e[4]||0),dx=x-e[0],dz=z-e[1],u=(c*dx+s*dz)/e[2],v=(-s*dx+c*dz)/e[3];return u*u+v*v<1};
const IS=[1694,2616,1050,170,Math.atan2(.762,.648)];
let CAN=[[-830,-850],[-760,-880],[-560,-900],[-330,-800],[-90,-680],[100,-520],[185,-400],[370,-230],[430,-40],[400,180],[270,360],[120,540],[20,640]];
for(let q=0;q<2;q++){const o=[CAN[0]];for(let i=0;i<CAN.length-1;i++){const a=CAN[i],b=CAN[i+1];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}o.push(CAN[CAN.length-1]);CAN=o}
const pip=(P,x,z)=>{let r=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])r=!r}return r};
const dCan=(x,z)=>{let m=1e9;for(let i=0;i<CAN.length-1;i++){const a=CAN[i],b=CAN[i+1],ex=b[0]-a[0],ez=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*ex+(z-a[1])*ez)/(ex*ex+ez*ez)));m=Math.min(m,Math.hypot(x-a[0]-ex*t,z-a[1]-ez*t))}return m};
const PARKS=[[350,-710,170,115,-.751],[560,-430,110,90,0],[-330,-860,210,120,.2],[-1480,820,400,280,.4],[-1250,1550,230,160,0],[1900,-900,150,120,0],[1500,-250,110,90,0],[-2300,-600,170,130,0],[1300,-2000,300,220,.5],[-1900,2400,350,260,.3],[2300,1300,260,200,.8]];
const inPark=(x,z)=>dCan(x,z)<70||PARKS.some(p=>inEl(p,x,z));
/* zones: -1 water, 0 old town, 1 centre, 2 left bank, 3 outskirts, 5 island */
function zone(x,z){const r=riv(x,z);if(r.d<r.hw+8)return inEl(IS,x,z)?5:-1;
  if(r.s<0){if(pip(CAN,x,z))return 0;return Math.hypot(x-300,z+300)<2300?1:3}
  return Math.hypot(x+1300,z-300)<2100?2:3}

/* ============ GL plumbing ============ */
const HEAD=`#version 300 es
precision highp float;precision highp int;precision highp sampler2D;
uniform mat4 uVP;uniform vec3 uCam,uSun,uSunC,uAmb,uZen,uHor;uniform float uT,uFog,uNight,uGlow;uniform sampler2D uMap,uHt;
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
vec2 muv(vec2 p){return(p-vec2(${MCX}.,${MCZ}.))/${MAPS}.+.5;}
vec3 skyG(vec3 d){float y=max(d.y,0.);vec3 c=mix(uHor,uZen,pow(y,.5));float s=max(dot(d,uSun),0.);
 return c+uSunC*(pow(s,6.)*.16+pow(s,90.)*.3)*uGlow;}
vec3 tm(vec3 c){c=1.-exp(-c*1.5);return pow(c,vec3(.9));}
`;
const FRAG=`
vec3 nrmD(vec3 w){return normalize(cross(dFdx(w),dFdy(w)));}
float shadow(vec3 w,vec3 n){
 float l=length(uSun.xz);if(l<.02||distance(w,uCam)>4500.)return 1.;vec2 dir=uSun.xz/l;float te=uSun.y/l;
 float dt=min(48./te,240.)/10.,lod=max(0.,log2(dt*.3));
 vec2 p=w.xz+n.xz*4.;float s=1.;
 for(int i=0;i<10;i++){float t=(float(i)+.5)*dt+1.;float h=textureLod(uHt,muv(p+dir*t),lod).r*255.;
  s=min(s,clamp((w.y+t*te-h)*.3+1.,0.,1.));}
 return s;}
vec3 lit(vec3 alb,vec3 n,vec3 w){float nl=max(dot(n,uSun),0.);float sh=nl>0.?shadow(w,n):0.;
 return alb*(uSunC*nl*sh+uAmb*(.6+.4*n.y));}
vec3 fin(vec3 c,vec3 w){vec3 v=w-uCam;float d=length(v);v/=d;
 return tm(mix(c,skyG(normalize(vec3(v.x,.03,v.z))),1.-exp(-d*uFog)));}
`;
function prog(vs,fs){
  const p=gl.createProgram();
  for(const[t,s]of[[gl.VERTEX_SHADER,HEAD+vs],[gl.FRAGMENT_SHADER,HEAD+FRAG+fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)){const e=gl.getShaderInfoLog(sh);console.error(e,s);fail('Ошибка шейдера:\n'+e)}gl.attachShader(p,sh)}
  gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS)){const e=gl.getProgramInfoLog(p);console.error(e);fail('Ошибка сборки шейдера:\n'+e)}
  const c={};p.u=n=>n in c?c[n]:(c[n]=gl.getUniformLocation(p,n));return p}
const F32=a=>a instanceof Float32Array?a:new Float32Array(a);
function buf(d,dyn){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,F32(d),dyn?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);return b}
/* attrs: [buffer, [[loc,size],...], divisor] */
function vao(list,idx){const v=gl.createVertexArray();gl.bindVertexArray(v);
  for(const[b,as,div]of list){gl.bindBuffer(gl.ARRAY_BUFFER,b);const st=as.reduce((s,a)=>s+a[1],0)*4;let o=0;
    for(const[loc,sz]of as){gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,sz,gl.FLOAT,false,st,o);if(div)gl.vertexAttribDivisor(loc,div);o+=sz*4}}
  if(idx){const e=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,e);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(idx),gl.STATIC_DRAW)}
  gl.bindVertexArray(null);return v}

/* ============ mesh builders (pos + colour + material; normals come from screen-space derivatives) ============ */
const mesh=()=>({v:[],i:[],fp:[],k:[.8,.8,.8],mt:0,nf:0});
const C=(m,k,mt)=>{m.k=k;m.mt=mt||0};
const V=(m,x,y,z)=>{m.v.push(x,y,z,m.k[0],m.k[1],m.k[2],m.mt);return m.v.length/7-1};
function box(m,cx,y0,cz,w,h,d,rot,tp){rot=rot||0;tp=tp==null?1:tp;const c=Math.cos(rot),s=Math.sin(rot),o=m.v.length/7;
  for(let j=0;j<2;j++)for(const[a,b]of[[-1,-1],[1,-1],[1,1],[-1,1]]){const k=j?tp:1,lx=a*w/2*k,lz=b*d/2*k;V(m,cx+c*lx-s*lz,y0+j*h,cz+s*lx+c*lz)}
  m.i.push(o,o+1,o+5,o,o+5,o+4,o+1,o+2,o+6,o+1,o+6,o+5,o+2,o+3,o+7,o+2,o+7,o+6,o+3,o,o+4,o+3,o+4,o+7,o+4,o+5,o+6,o+4,o+6,o+7);
  if(!m.nf)m.fp.push([cx,cz,w,d,rot,y0+h,0])}
/* gable roof, ridge along local x */
function gab(m,cx,y0,cz,w,h,d,rot){rot=rot||0;const c=Math.cos(rot),s=Math.sin(rot),o=m.v.length/7,P=(lx,y,lz)=>V(m,cx+c*lx-s*lz,y,cz+s*lx+c*lz);
  P(-w/2,y0,-d/2);P(w/2,y0,-d/2);P(w/2,y0,d/2);P(-w/2,y0,d/2);P(-w/2,y0+h,0);P(w/2,y0+h,0);
  m.i.push(o,o+1,o+5,o,o+5,o+4,o+3,o+2,o+5,o+3,o+5,o+4,o,o+3,o+4,o+1,o+2,o+5)}
/* solid of revolution with n flat sides; r is the inradius */
function lathe(m,cx,cz,pr,n,rot){rot=rot||0;const o=m.v.length/7,k=1/Math.cos(Math.PI/n);
  for(const[r,y]of pr)for(let j=0;j<n;j++){const a=rot+(j+.5)/n*6.2832;V(m,cx+Math.cos(a)*r*k,y,cz+Math.sin(a)*r*k)}
  for(let q=0;q<pr.length-1;q++)for(let j=0;j<n;j++){const a=o+q*n+j,b=o+q*n+(j+1)%n;m.i.push(a,b,a+n,b,b+n,a+n)}
  if(!m.nf){let rm=0,h=0;for(const p of pr)rm=Math.max(rm,p[0]);for(const p of pr)if(p[0]>=rm*.6)h=Math.max(h,p[1]);m.fp.push([cx,cz,rm*2,rm*2,rot,h,0])}}
function ball(m,x,y,z,r){const f=m.nf;m.nf=1;lathe(m,x,z,[[0,y+r],[r*.75,y+r*.65],[r,y],[r*.75,y-r*.65],[0,y-r]],6);m.nf=f}
function cyl(m,a,b,r0,r1,n){const z=nrm(sub(b,a));let x=nrm(Math.abs(z[1])<.9?cross([0,1,0],z):cross([1,0,0],z));const y=cross(z,x),o=m.v.length/7;
  for(let k=0;k<2;k++){const c=k?b:a,r=k?r1:r0;for(let j=0;j<n;j++){const t=j/n*6.2832,cs=Math.cos(t)*r,sn=Math.sin(t)*r;V(m,c[0]+x[0]*cs+y[0]*sn,c[1]+x[1]*cs+y[1]*sn,c[2]+x[2]*cs+y[2]*sn)}}
  for(let j=0;j<n;j++){const j2=(j+1)%n;m.i.push(o+j,o+j2,o+n+j,o+j2,o+n+j2,o+n+j)}}
/* extrude a convex (x,y) outline along z */
function ext(m,pl,z0,z1,fh){const o=m.v.length/7,n=pl.length;for(const z of[z0,z1])for(const[x,y]of pl)V(m,x,y,z);
  for(let j=0;j<n;j++){const j2=(j+1)%n;m.i.push(o+j,o+j2,o+n+j,o+j2,o+n+j2,o+n+j)}
  for(let j=1;j<n-1;j++)m.i.push(o,o+j,o+j+1,o+n,o+n+j,o+n+j+1);
  let x0=1e9,x1=-1e9;for(const p of pl){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0])}
  if(!m.nf)m.fp.push([(x0+x1)/2,(z0+z1)/2,x1-x0,Math.abs(z1-z0),0,fh,0])}
/* barrel vault, length along local x */
function vault(m,cx,cz,len,wd,ht,rot){const c=Math.cos(rot),s=Math.sin(rot),o=m.v.length/7,NA=8;
  for(let e=0;e<2;e++)for(let j=0;j<=NA;j++){const a=j/NA*Math.PI,lx=(e-.5)*len,lz=Math.cos(a)*wd/2;V(m,cx+c*lx-s*lz,Math.sin(a)*ht,cz+s*lx+c*lz)}
  for(let j=0;j<NA;j++)m.i.push(o+j,o+j+1,o+NA+1+j,o+j+1,o+NA+2+j,o+NA+1+j);
  for(let e=0;e<2;e++)for(let j=1;j<NA;j++)m.i.push(o+e*(NA+1),o+e*(NA+1)+j,o+e*(NA+1)+j+1);
  m.fp.push([cx,cz,len,wd,rot,ht*.75,0])}

/* ============ landmarks ============ */
const LMK=mesh(),FP=[],LBL=[],BRC=[];
function lm(name,x,z,rot,pad,fn){const m=mesh();fn(m);const c=Math.cos(rot),s=Math.sin(rot),o=LMK.v.length/7;
  for(let k=0;k<m.v.length;k+=7){const lx=m.v[k],lz=m.v[k+2];LMK.v.push(x+c*lx-s*lz,m.v[k+1],z+s*lx+c*lz,m.v[k+3],m.v[k+4],m.v[k+5],m.v[k+6])}
  for(const i of m.i)LMK.i.push(o+i);
  for(const f of m.fp)FP.push([x+c*f[0]-s*f[1],z+s*f[0]+c*f[1],f[2],f[3],f[4]+rot,f[5],pad,f[6]]);
  if(name)LBL.push([name,x,z])}
const BR=[.56,.28,.2],RD=[.56,.23,.15],CU=[.3,.52,.43],DK=[.17,.21,.2],WH=[.88,.86,.8],GD=[.95,.72,.25];
lm('Церковь Святого Петра',0,0,0,14,m=>{C(m,BR);box(m,20,0,0,60,24,28);box(m,-19,0,0,18,57,18);C(m,RD);gab(m,20,24,0,60,13,28);
  C(m,DK);m.nf=1;lathe(m,-19,0,[[9.5,57],[9.5,58.5],[6,61],[6,67],[7.2,67.5],[4.6,72],[4.2,79],[5.2,79.5],[3,85],[2.6,93],[3.4,93.5],[1.3,101],[.5,113],[0,123]],8);
  C(m,GD,3);ball(m,-19,123.5,0,1.2)});
lm('Домский собор',-279,-178,.25,16,m=>{C(m,BR);box(m,18,0,0,70,22,32);box(m,-24,0,0,20,48,20);box(m,60,0,0,16,16,20);C(m,[.33,.4,.37]);gab(m,18,22,0,70,12,32);
  C(m,DK);m.nf=1;lathe(m,-24,0,[[10.5,48],[10.5,50],[9,53],[8,60],[5.5,66],[3.2,68],[3.2,74],[4,74.5],[2.2,80],[.6,86],[0,90]],8);C(m,GD,3);ball(m,-24,90.6,0,1.1)});
lm('Собор Святого Иакова',-291,-334,.3,10,m=>{C(m,BR);box(m,12,0,0,44,17,20);box(m,-16,0,0,12,38,12);C(m,RD);gab(m,12,17,0,44,9,20);
  C(m,CU);m.nf=1;lathe(m,-16,0,[[6.6,38],[6.6,39.5],[4.6,42],[.35,80],[0,82]],8);C(m,GD,3);ball(m,-16,82.5,0,.8)});

    setI(t*6+k,p[0]-Math.sin(p[3])*sd,p[1]+.3,p[2]+Math.cos(p[3])*sd,p[3],25,3.8,3.2,.35,t?[.2,.36,.62]:[.92,.76,.16],3,[.3,.3,.32],k*.13+t*.5)}
  BOATS.forEach((b,k)=>{const span=b.i1-16;let f=16+((((b.f-16+T*b.sp)%span)+span)%span);const i=Math.floor(f),u=f-i,a=RC[i],c=RC[i+1];
    const x=a[0]+(c[0]-a[0])*u,z=a[1]+(c[1]-a[1])*u;
    setI(12+k,x-a[4]*b.off,WL-.6,z+a[3]*b.off,Math.atan2(a[4],a[3]),b.L,3.4,b.L*.24,.8,[.92,.92,.9],3,[.3,.4,.55],k*.21)});
  gl.bindBuffer(gl.ARRAY_BUFFER,dynB);gl.bufferSubData(gl.ARRAY_BUFFER,0,DYN)}

/* ============ camera, input ============ */
const WP=[[-1000,70,760],[-700,32,330],[-420,45,-120],[-640,55,-470],[-900,150,-720],[-520,150,-860],[-150,115,-560],[140,85,-440],[400,115,-640],[620,150,-380],[400,110,-130],[110,150,-70],[-160,125,-170],[-200,95,70],[90,90,330],[430,90,440],[820,150,620],[720,200,1150],[1100,230,1900],[1480,270,2400],[1960,310,2620],[1760,290,3020],[1150,190,2420],[350,90,1550],[-150,75,760],[-520,40,480],[-860,85,640]];
const TP=[],TLc=[0];
{const n=WP.length;for(let i=0;i<n;i++)for(let k=0;k<16;k++)TP.push([0,1,2].map(j=>catmull(WP[(i+n-1)%n][j],WP[i][j],WP[(i+1)%n][j],WP[(i+2)%n][j],k/16)));
 TP.push(TP[0]);for(let i=1;i<TP.length;i++)TLc.push(TLc[i-1]+Math.hypot(TP[i][0]-TP[i-1][0],TP[i][1]-TP[i-1][1],TP[i][2]-TP[i-1][2]))}
const TLT=TLc[TLc.length-1];
function tourPos(s){s=((s%TLT)+TLT)%TLT;let lo=0,hi=TLc.length-1;while(hi-lo>1){const m=lo+hi>>1;if(TLc[m]<=s)lo=m;else hi=m}
  const a=TP[lo],b=TP[lo+1],t=(s-TLc[lo])/(TLc[lo+1]-TLc[lo]);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]}
let tS=+QS.get('ts')||0;
const cam={p:tourPos(tS),v:[0,0,0],yaw:.6,pitch:-.1};
let tour=true,started=false,quality=COARSE?.45:1,rs=1;
const keys={};let joy=null,look=null,jv=[0,0];
addEventListener('keydown',e=>{keys[e.code]=1;if(started&&/Key[WASDQE]/.test(e.code))setTour(false)});
addEventListener('keyup',e=>{keys[e.code]=0});
function setTour(v){tour=v;$('bTour').classList.toggle('on',v)}
cv.addEventListener('click',()=>{if(started&&!('ontouchstart'in window)){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{})}catch(e){}}});
addEventListener('mousemove',e=>{if(!started)return;if(document.pointerLockElement===cv||(e.buttons&1)){setTour(false);cam.yaw+=e.movementX*.0023;cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch-e.movementY*.0023))}});
cv.addEventListener('touchstart',e=>{e.preventDefault();if(!started)return;for(const t of e.changedTouches){
  if(t.clientX<innerWidth/2&&!joy){joy={id:t.identifier,x:t.clientX,y:t.clientY};const j=$('joy');j.style.display='block';j.style.left=t.clientX+'px';j.style.top=t.clientY+'px';setTour(false)}
  else if(!look)look={id:t.identifier,x:t.clientX,y:t.clientY}}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){
  if(joy&&t.identifier===joy.id){let dx=t.clientX-joy.x,dy=t.clientY-joy.y;const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}jv=[dx/m,-dy/m];$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`}
  if(look&&t.identifier===look.id){setTour(false);cam.yaw+=(t.clientX-look.x)*.005;cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch-(t.clientY-look.y)*.005));look.x=t.clientX;look.y=t.clientY}}},{passive:false});
const tend=e=>{for(const t of e.changedTouches){if(joy&&t.identifier===joy.id){joy=null;jv=[0,0];$('joy').style.display='none';$('joy').firstChild.style.transform=''}if(look&&t.identifier===look.id)look=null}};
cv.addEventListener('touchend',tend);cv.addEventListener('touchcancel',tend);

/* ============ time of day ============ */
const ENV=[{n:'День',sun:[.45,.75,.5],sc:[1.5,1.42,1.3],am:[.42,.5,.62],ze:[.16,.36,.72],ho:[.62,.74,.86],fog:.00016,ni:0,gl:.6},
 {n:'Закат',sun:[-.82,.17,-.4],sc:[1.8,1.0,.5],am:[.36,.38,.52],ze:[.17,.27,.56],ho:[1.0,.62,.36],fog:.00022,ni:.15,gl:1.2},
 {n:'Ночь',sun:[-.3,.55,.5],sc:[.1,.13,.2],am:[.035,.045,.08],ze:[.006,.01,.03],ho:[.05,.05,.085],fog:.00018,ni:1,gl:.2}];
let tod=QS.has('tod')?+QS.get('tod'):1;const env=JSON.parse(JSON.stringify(ENV[tod]));
function setTod(v){tod=v;$('bTod').textContent=ENV[v].n}
function envStep(k){const t=ENV[tod];for(const key in t){if(key==='n')continue;if(Array.isArray(t[key]))for(let i=0;i<3;i++)env[key][i]+=(t[key][i]-env[key][i])*k;else env[key]+=(t[key]-env[key])*k}}

/* ============ sound: wind made from filtered noise ============ */
let ac,master,snd=false;
function sound(on){snd=on;$('bSnd').classList.toggle('on',on);
  try{if(on&&!ac){ac=new(window.AudioContext||window.webkitAudioContext)();const n=ac.sampleRate*4,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;
      for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.2}
      const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.5;
      const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.11;lg.gain.value=160;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
      master=ac.createGain();master.gain.value=0;s.connect(f);f.connect(master);master.connect(ac.destination);s.start()}
    if(ac){ac.resume();if(!on)master.gain.setTargetAtTime(0,ac.currentTime,.2)}}catch(e){}}
function begin(s){started=true;$('ov').classList.add('h');if(s)sound(true)}
$('go').onclick=()=>begin(1);
$('bTour').onclick=()=>setTour(!tour);
$('bTod').onclick=()=>setTod((tod+1)%3);
$('bSnd').onclick=()=>sound(!snd);
$('bQ').onclick=()=>{quality=quality>.8?.45:quality>.3?.2:1;rs=1};
setTod(tod);

/* ============ frame ============ */
const FOV=1.15;let VP,sunN;
function S(p,T){gl.useProgram(p);gl.uniformMatrix4fv(p.u('uVP'),false,VP);gl.uniform3fv(p.u('uCam'),cam.p);gl.uniform3fv(p.u('uSun'),sunN);
  gl.uniform3fv(p.u('uSunC'),env.sc);gl.uniform3fv(p.u('uAmb'),env.am);gl.uniform3fv(p.u('uZen'),env.ze);gl.uniform3fv(p.u('uHor'),env.ho);
  gl.uniform1f(p.u('uT'),T);gl.uniform1f(p.u('uFog'),env.fog);gl.uniform1f(p.u('uNight'),env.ni);gl.uniform1f(p.u('uGlow'),env.gl);
  gl.uniform1i(p.u('uMap'),0);gl.uniform1i(p.u('uHt'),1)}
let last=performance.now(),T=+QS.get('t')||0,acc=0,frames=0,fps=60,slow=0,spd=0;
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;T+=dt;acc+=dt;frames++;
  envStep(1-Math.exp(-dt*1.6));sunN=nrm(env.sun);
  if(acc>.5){fps=frames/acc;if(fps<28&&rs>.45){if(++slow>1){rs*=.82;slow=0}}else slow=0;acc=0;frames=0;
    const hd=((cam.yaw*57.2958)%360+360)%360;
    $('hud').textContent=`Высота ${(cam.p[1]-WL).toFixed(0)} м · курс ${hd.toFixed(0)}° · ${fps.toFixed(0)} к/с`;
    let bn='',bd=420;for(const l of LBL){const d=Math.hypot(l[1]-cam.p[0],l[2]-cam.p[2]);if(d<bd){bd=d;bn=l[0]}}
    const nm=$('nm');if(bn&&started){nm.textContent=bn;nm.style.opacity=1}else nm.style.opacity=0}
  const pr=Math.min(devicePixelRatio||1,2)*rs*(quality<.3?.7:1),W=Math.max(2,Math.floor(innerWidth*pr)),Hh=Math.max(2,Math.floor(innerHeight*pr));
  if(cv.width!==W||cv.height!==Hh){cv.width=W;cv.height=Hh}
  gl.viewport(0,0,W,Hh);

  /* camera */
  const P=cam.p,px=P[0],py=P[1],pz=P[2];
  if(tour){tS+=55*dt;const a=tourPos(tS),b=tourPos(tS+170);b[1]-=22;const d=nrm(sub(b,a)),ty=Math.atan2(d[0],-d[2]),tp=Math.asin(d[1]),k=1-Math.exp(-dt*1.5);
    for(let i=0;i<3;i++)P[i]+=(a[i]-P[i])*k;let dy=ty-cam.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cam.yaw+=dy*k;cam.pitch+=(tp-cam.pitch)*k;cam.v=[0,0,0]}
  const cp=Math.cos(cam.pitch),f=[Math.sin(cam.yaw)*cp,Math.sin(cam.pitch),-Math.cos(cam.yaw)*cp],r=[Math.cos(cam.yaw),0,Math.sin(cam.yaw)],u=cross(r,f);
  if(!tour){const fw=(keys.KeyW?1:0)-(keys.KeyS?1:0)+jv[1],st=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jv[0],up=(keys.KeyE||keys.Space?1:0)-(keys.KeyQ?1:0),sp=keys.ShiftLeft||keys.ShiftRight?150:50,k=1-Math.exp(-dt*3);
    for(let i=0;i<3;i++){const w=(f[i]*fw+r[i]*st+(i===1?up*.7:0))*sp;cam.v[i]+=(w-cam.v[i])*k;P[i]+=cam.v[i]*dt}}
  P[0]=Math.max(MCX-3600,Math.min(MCX+3600,P[0]));P[2]=Math.max(MCZ-3600,Math.min(MCZ+3600,P[2]));
  const fl=floorAt(P[0],P[2])+2.5;if(P[1]<fl)P[1]+=(fl-P[1])*Math.min(1,dt*10);P[1]=Math.min(1500,Math.max(WL+1.5,P[1]));
  spd+=(Math.hypot(P[0]-px,P[1]-py,P[2]-pz)/Math.max(dt,1e-3)-spd)*.1;
  if(ac&&snd)master.gain.setTargetAtTime(.12+Math.min(spd,160)/160*.4,ac.currentTime,.3);
  const as=W/Hh,view=new Float32Array([r[0],u[0],-f[0],0,r[1],u[1],-f[1],0,r[2],u[2],-f[2],0,-(r[0]*P[0]+r[1]*P[1]+r[2]*P[2]),-(u[0]*P[0]+u[1]*P[1]+u[2]*P[2]),f[0]*P[0]+f[1]*P[1]+f[2]*P[2],1]);
  VP=mul(persp(FOV,as,1,60000),view);const th=Math.tan(FOV/2);
  moveThings(T);

  gl.clear(gl.DEPTH_BUFFER_BIT);
  S(pBld,T);gl.bindVertexArray(vBld);gl.drawElementsInstanced(gl.TRIANGLES,UI.length,gl.UNSIGNED_INT,0,nBld);
  gl.bindVertexArray(vDyn);gl.drawElementsInstanced(gl.TRIANGLES,UI.length,gl.UNSIGNED_INT,0,NDYN);
  S(pLm,T);gl.uniform4f(pLm.u('uOff'),0,0,0,1);gl.bindVertexArray(vLmk);gl.drawElements(gl.TRIANGLES,nLmk,gl.UNSIGNED_INT,0);
  for(const b of BAL){const a=b.ph+T*b.w;gl.uniform4f(pLm.u('uOff'),-100+Math.cos(a)*b.R,b.y+25*Math.sin(T*.05+b.ph),-150+Math.sin(a)*b.R,1);gl.bindVertexArray(b.v);gl.drawElements(gl.TRIANGLES,b.n,gl.UNSIGNED_INT,0)}
  S(pTree,T);gl.bindVertexArray(vTree);gl.drawElementsInstanced(gl.TRIANGLES,nTreeI,gl.UNSIGNED_INT,0,Math.floor(nTree*Math.min(1,quality+.15)));
  S(pGnd,T);gl.bindVertexArray(vGnd);gl.uniform1f(pGnd.u('uY'),0);gl.drawElements(gl.TRIANGLES,nGnd,gl.UNSIGNED_INT,0);
  gl.uniform1f(pGnd.u('uY'),WL);gl.drawElements(gl.TRIANGLES,nGnd,gl.UNSIGNED_INT,0);
  S(pCar,T);gl.uniform1f(pCar.u('uPx'),Hh*.5/th);gl.bindVertexArray(vCar);gl.drawArrays(gl.POINTS,0,nCar);
  S(pBird,T);gl.bindVertexArray(vBird);gl.drawElementsInstanced(gl.TRIANGLES,6,gl.UNSIGNED_INT,0,nBird);
  S(pSky,T);gl.uniform3fv(pSky.u('uR'),r);gl.uniform3fv(pSky.u('uU'),u);gl.uniform3fv(pSky.u('uF'),f);gl.uniform2f(pSky.u('uTa'),th*as,th);
  gl.bindVertexArray(null);gl.drawArrays(gl.TRIANGLES,0,3);
}
if(QS.has('cam')){const c=QS.get('cam').split(',').map(Number);cam.p=[c[0],c[1],c[2]];cam.yaw=(c[3]||0)/57.2958;cam.pitch=(c[4]||0)/57.2958;setTour(false)}
if(QS.has('auto'))begin(0);
window.__w={cam,setTour,setTod,start:()=>begin(0),stats:{buildings:nBld,trees:nTree,cars:nCar}};
requestAnimationFrame(frame);
</script>
</body>
</html>
